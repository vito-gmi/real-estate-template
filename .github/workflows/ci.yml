name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  static:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
        env:
          SKIP_ENV_VALIDATION: '1'
      - run: npm test

  build:
    name: Production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          SKIP_ENV_VALIDATION: '1'
          NEXT_PUBLIC_SITE_URL: https://example.com

  database:
    name: Migrations, seed and search benchmark
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: estate
          POSTGRES_PASSWORD: estate
          POSTGRES_DB: estate
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U estate -d estate"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://estate:estate@localhost:5433/estate
      AUTH_SECRET: ci-only-secret-value-that-is-long-enough-000000
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Apply migrations
        run: npm run db:migrate
      - name: Seed demo data
        run: npm run db:seed
      - name: Seed 50k synthetic listings
        run: npm run db:seed:bench
      - name: Assert search stays within the latency budget
        run: npm run bench:search

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: estate
          POSTGRES_PASSWORD: estate
          POSTGRES_DB: estate
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U estate -d estate"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://estate:estate@localhost:5433/estate
      AUTH_SECRET: ci-only-secret-value-that-is-long-enough-000000
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      STORAGE_DRIVER: local
      MAIL_DRIVER: console
      IP_HASH_SALT: ci-ip-hash-salt-change-me-now
      PREVIEW_TOKEN_SECRET: ci-preview-secret-change-me
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm run build
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
