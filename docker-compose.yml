services:
  postgres:
    image: postgres:17-alpine
    container_name: estate-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: estate
      # `estate` is fine for local development. On a server set POSTGRES_PASSWORD
      # in `.env` BEFORE the first start: Postgres only reads it when it creates
      # the data volume. Use letters and digits only (openssl rand -hex 24), as
      # it is also placed inside the app's DATABASE_URL.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-estate}
      POSTGRES_DB: estate
    ports:
      # Loopback only: reachable from this machine (`npm run dev`, migrations),
      # never from the network. On all interfaces, a self-hosted server would
      # expose its database to the internet.
      - '127.0.0.1:5433:5432'
    volumes:
      - estate-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U estate -d estate']
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    profiles: ['selfhost']
    build:
      context: .
      dockerfile: Dockerfile
      # Compiled into the app by `next build` (see Dockerfile): changing one of
      # these needs `docker compose --profile selfhost up --build`.
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
        NEXT_PUBLIC_MEDIA_BASE_URL: ${NEXT_PUBLIC_MEDIA_BASE_URL:-/media}
        NEXT_PUBLIC_MAP_STYLE_URL: ${NEXT_PUBLIC_MAP_STYLE_URL:-}
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://estate:${POSTGRES_PASSWORD:-estate}@postgres:5432/estate
      # No fallbacks on purpose: a published default lets anyone forge upload
      # and preview tokens. Until these are set (openssl rand -base64 48, in a
      # `.env` file next to this one) the app logs the missing names at startup
      # and answers every request with an error.
      AUTH_SECRET: ${AUTH_SECRET:-}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      LOCAL_STORAGE_DIR: /data/storage
      MAIL_DRIVER: ${MAIL_DRIVER:-console}
      IP_HASH_SALT: ${IP_HASH_SALT:-}
      PREVIEW_TOKEN_SECRET: ${PREVIEW_TOKEN_SECRET:-}
      # Caddy overwrites X-Real-IP on every request (see Caddyfile).
      CLIENT_IP_HEADER: x-real-ip
    volumes:
      - estate-media:/data/storage
    expose:
      - '3000'
    ports:
      # Loopback only. Published on all interfaces, port 3000 let clients skip
      # Caddy (no TLS, no X-Real-IP overwrite) and spoof their address.
      - '127.0.0.1:3000:3000'

  caddy:
    profiles: ['selfhost']
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - '80:80'
      - '443:443'
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - estate-caddy-data:/data
      - estate-caddy-config:/config

volumes:
  estate-pgdata:
  estate-media:
  estate-caddy-data:
  estate-caddy-config:
