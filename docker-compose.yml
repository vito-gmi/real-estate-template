services:
  postgres:
    image: postgres:17-alpine
    container_name: estate-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: estate
      POSTGRES_PASSWORD: estate
      POSTGRES_DB: estate
    ports:
      - '5433:5432'
    volumes:
      - estate-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U estate -d estate']
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    profiles: ['selfhost']
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://estate:estate@postgres:5432/estate
      AUTH_SECRET: ${AUTH_SECRET:-change-me-to-a-random-48-byte-base64-string-abcdefgh}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      LOCAL_STORAGE_DIR: /data/storage
      MAIL_DRIVER: ${MAIL_DRIVER:-console}
      IP_HASH_SALT: ${IP_HASH_SALT:-change-me-random-32-chars-minimum}
      PREVIEW_TOKEN_SECRET: ${PREVIEW_TOKEN_SECRET:-change-me-random-32-chars-minimum}
    volumes:
      - estate-media:/data/storage
    expose:
      - '3000'
    ports:
      - '3000:3000'

  caddy:
    profiles: ['selfhost']
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - '80:80'
      - '443:443'
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - estate-caddy-data:/data
      - estate-caddy-config:/config

volumes:
  estate-pgdata:
  estate-media:
  estate-caddy-data:
  estate-caddy-config:
